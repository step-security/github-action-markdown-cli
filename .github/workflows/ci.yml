# yamllint disable rule:line-length
---
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: Perform pre-commit checks
        uses: step-security/pre-commit-action@v3
        env:
          SKIP: no-commit-to-branch

  local-test:
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Clone the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the problem matcher
        id: expect-failure
        uses: ./
        with:
          config_file: .markdownlintrc
          files: .
          rules: examples/rules/custom.js
        continue-on-error: true
      - name: Check the result of the problem matcher test
        if: ${{ steps.expect-failure.outcome != 'failure' }}
        run: |
          exit 1
      - name: Test ignore_files
        uses: ./
        with:
          config_file: .markdownlintrc
          files: .
          ignore_files: examples/ignore/*
          rules: examples/rules/custom.js
      - name: Test ignore_path
        uses: ./
        with:
          config_file: .markdownlintrc
          files: .
          ignore_path: examples/.markdownlintignore
          rules: examples/rules/custom.js
