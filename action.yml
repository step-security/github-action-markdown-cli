---
name: markdownlint-cli
author: 'step-security'
description: Style checker and lint tool for Markdown/CommonMark files.

inputs:
  config_file:
    description: configuration file (JSON or YAML)
    required: false
  dot:
    description: include files/folders with a dot (for example `.github`)
    required: false
  files:
    description: files, directories, or globs
    required: true
  ignore_files:
    description: files to ignore/exclude
    required: false
  ignore_path:
    description: path to file with ignore pattern(s)
    required: false
  rules:
    description: custom rule files
    required: false

runs:
  using: 'docker'
  image: 'docker://ghcr.io/step-security/github-action-markdown-cli:v3.5.0@sha256:cfd9a7ea5be96da0719896221bd434a0e87fdeda3bfaa3e070705260b4edfcff' # v3.5.0

branding:
  icon: check-circle
  color: purple
